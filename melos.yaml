name: odoo_pos
repository: https://github.com/example/odoo_pos

packages:
  - apps/pos_app
  - packages/**

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: Static analysis across all packages
    run: melos exec -- "dart analyze"

  format:
    description: Format all Dart code
    run: melos exec -- "dart format ."

  test:
    description: Run unit tests in all packages
    run: melos exec --dir-exists=test -- "flutter test"

  build_runner:
    description: Run build_runner for code-gen packages
    run: melos exec --depends-on="build_runner" -- "dart run build_runner build --delete-conflicting-outputs"

  clean:
    description: Clean all build artifacts
    run: melos exec -- "flutter clean"
