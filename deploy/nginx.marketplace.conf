# 跨店市集 SPA（marketplace_web build，base=/market/）
# 僅供 Docker「marketplace_web」容器使用；對外由主機 Caddy handle_path /market 反代至此容器。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
