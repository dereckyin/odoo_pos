# 顧客端 SPA（customer_order_web build，base=/customer/）
# 僅供 Docker「customer_web」容器使用；對外由主機 Caddy handle_path /customer 反代至此容器。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
