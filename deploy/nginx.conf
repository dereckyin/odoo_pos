server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vite hashed chunks live under /assets/. If a chunk is missing (stale index.html
    # vs new deploy), we must NOT fall back to index.html — that yields text/html and
    # "Failed to load module script" in the browser.
    # 產品說明（pos_doc）— 與後台同域，避免相對路徑指到 SPA
    location = /readme {
        return 301 /readme/;
    }

    location = /readme/pos-release.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="點餐趣-pos.apk"';
        try_files $uri =404;
    }

    location ^~ /readme/ {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/vnd.android.package-archive apk;
        }
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # After deploy, index.html must refresh so hashed /assets/* URLs stay in sync.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
