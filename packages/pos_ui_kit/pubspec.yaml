name: pos_ui_kit
description: Shared Flutter widgets for POS UI (large buttons, num pad, product card).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.2
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  pos_core:
    path: ../pos_core
  pos_domain:
    path: ../pos_domain
  cached_network_image: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
