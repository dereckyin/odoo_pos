services:
  postgres:
    image: postgres:16-alpine
    container_name: pos_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pos_redis_prod
    restart: unless-stopped
    volumes:
      - pos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pos_api_prod
    restart: unless-stopped
    env_file:
      - ./deploy/.env.api
    environment:
      DATABASE_URL: postgresql+asyncpg://pos:pos@postgres:5432/pos
      REDIS_URL: redis://redis:6379/0
      ENV: production
      UPLOAD_DIR: /app/uploads
    volumes:
      - pos_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  web:
    image: nginx:alpine
    container_name: pos_web_prod
    restart: unless-stopped
    ports:
      - "9088:80"
    volumes:
      - ./apps/admin/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # 顧客掃碼點餐靜態站（build 輸出 → apps/customer_order_web/dist）
  # 僅綁 localhost，由主機 Caddy 以 handle_path /customer 反代至 9089
  customer_web:
    image: nginx:alpine
    container_name: pos_customer_web_prod
    restart: unless-stopped
    ports:
      - "9089:80"
    volumes:
      - ./apps/customer_order_web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.customer.conf:/etc/nginx/conf.d/default.conf:ro

  # 跨店市集（base=/market/）— Caddy handle_path /market 反代至 9090
  marketplace_web:
    image: nginx:alpine
    container_name: pos_marketplace_web_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:80"
    volumes:
      - ./apps/marketplace_web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.marketplace.conf:/etc/nginx/conf.d/default.conf:ro

  # 網頁收銀（base=/pos/）— Caddy handle_path /pos 反代至 9091
  cashier_web:
    image: nginx:alpine
    container_name: pos_cashier_web_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:80"
    volumes:
      - ./apps/pos_web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.pos.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pos_pgdata:
  pos_redisdata:
  pos_uploads:
