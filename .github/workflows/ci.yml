name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: FastAPI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        working-directory: apps/api
        run: ruff check app
      - name: Pytest
        working-directory: apps/api
        run: pytest -q

  domain:
    name: pos_core + pos_domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve pos_core deps
        working-directory: packages/pos_core
        run: dart pub get
      - name: Analyze pos_core
        working-directory: packages/pos_core
        run: dart analyze
      - name: Resolve pos_domain deps
        working-directory: packages/pos_domain
        run: dart pub get
      - name: Analyze pos_domain
        working-directory: packages/pos_domain
        run: dart analyze --fatal-infos --no-fatal-warnings || true
      - name: Run pos_domain tests
        working-directory: packages/pos_domain
        run: dart test
